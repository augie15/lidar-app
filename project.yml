name: Tilda
options:
  bundleIdPrefix: com.augie15
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config/Tilda.xcconfig
  Release: Config/Tilda.xcconfig
targets:
  Tilda:
    type: application
    platform: iOS
    sources: [Tilda]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.augie15.tilda
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "2"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        INFOPLIST_FILE: Tilda/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
