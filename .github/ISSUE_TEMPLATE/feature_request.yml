name: Feature request
description: Suggest an idea or improvement for Tilda.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. This issue is public, so please don't include personal details.
  - type: textarea
    id: description
    attributes:
      label: What would you like to see?
      description: Describe the feature and the problem it would solve.
    validations:
      required: true
  - type: dropdown
    id: scan_mode
    attributes:
      label: Related scan mode
      options:
        - Room
        - Whole floor
        - Object Photoreal
        - Object LiDAR quick
        - Mesh
        - Point cloud
        - Surfaces
        - Not scan related
    validations:
      required: false
  - type: input
    id: app_version
    attributes:
      label: App version
      placeholder: "1.0 (1)"
    validations:
      required: false
  - type: input
    id: ios_version
    attributes:
      label: iOS version
      placeholder: "iOS 26.0"
    validations:
      required: false
  - type: input
    id: device
    attributes:
      label: Device
      placeholder: "iPhone18,2"
    validations:
      required: false
